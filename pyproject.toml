[project]
name = "logolas"
version = "0.1.0"
description = "logolas"
readme = "README.md"
authors = [
    { name = "Grzegorz Siudak" },
    { name = "Paweł Skierś" },
    { name = "Kamil Deja" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.14.3",
    "biopython==1.86",
    "bottleneck==1.4.2",
    "cpldiff",
    "einops==0.8.1",
    "gdown==5.2.0",
    "huggingface-hub==0.36.0",
    "levenshtein>=0.27.5",
    "matplotlib==3.10.7",
    "moocore==0.1.10",
    "networkx==3.6",
    "numba==0.62.1",
    "numexpr==2.14.1",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "polyleven==0.9.0",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "seqme==0.3.7",
    "sympy==1.14.0",
    "tensorboard==2.20.0",
    "torch==2.9.1",
    "tqdm==4.67.1",
    "transformers==4.57.3",
    "umap-learn==0.5.9.post2",
]

[project.scripts]
generate = "logolas.generate:main"

[tool.uv.sources]
cpldiff = { path = "src/CPL-Diff", editable = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
